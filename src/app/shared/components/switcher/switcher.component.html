<div class="relative flex items-center rounded-md bg-neutral p-1 shadow-sm w-full z-0">
  
  <!-- Sliding pill background -->
  <div class="absolute top-1 bottom-1 left-1 w-[calc(50%-0.25rem)] bg-primary rounded shadow transition-transform duration-300 ease-out z-0"
       [style.transform]="selectedValue === value1 ? 'translateX(0)' : 'translateX(100%)'">
  </div>

  <button 
    type="button"
    (click)="selectOption(value1)"
    [ngClass]="selectedValue === value1 ? 'text-white' : 'text-dark hover:text-gray-600'"
    class="relative z-10 flex-1 rounded py-2 text-sm font-medium transition-colors duration-300">
    {{ option1 }}
  </button>
  
  <button 
    type="button"
    (click)="selectOption(value2)"
    [ngClass]="selectedValue === value2 ? 'text-white' : 'text-dark hover:text-gray-600'"
    class="relative z-10 flex-1 rounded py-2 text-sm font-medium transition-colors duration-300">
    {{ option2 }}
  </button>
</div>
